<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Briefs Studio // Brief Slides [V3]</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: '#0F172A',
                        charcoal: '#1E293B',
                        amber: '#F59E0B',
                        emerald: '#10B981',
                        teal: '#0D9488',
                        fog: '#94A3B8',
                        bone: '#F8FAFC',
                    },
                    fontFamily: {
                        sans: ['IBM Plex Sans', 'sans-serif'],
                        serif: ['Newsreader', 'serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #0F172A;
            overflow-x: hidden;
        }

        .slide {
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4rem;
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
        }

        .gradient-text {
            background: linear-gradient(135deg, #F59E0B 0%, #10B981 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .moment-card {
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.5) 0%, rgba(15, 23, 42, 0.8) 100%);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(148, 163, 184, 0.1);
        }

        .slide-number {
            position: absolute;
            bottom: 2rem;
            right: 4rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: #F59E0B;
            letter-spacing: 0.2em;
            opacity: 0.4;
        }

        .slide-tag {
            position: absolute;
            top: 4rem;
            left: 4rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            color: #F59E0B;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            opacity: 0.6;
        }

        @media print {
            @page {
                size: landscape;
                margin: 0;
            }

            body {
                background-color: #0F172A !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .slide {
                height: 100vh !important;
                width: 100vw !important;
                page-break-after: always;
                break-after: page;
                border: none !important;
                padding: 4rem !important;
            }

            .moment-card {
                background: #1E293B !important;
                border: 1px solid rgba(148, 163, 184, 0.2) !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .gradient-text {
                background: none !important;
                -webkit-background-clip: initial !important;
                -webkit-text-fill-color: initial !important;
                background-clip: initial !important;
                color: #F59E0B !important;
            }

            #export-controls {
                display: none !important;
            }

            p,
            h1,
            h2,
            h3,
            h4,
            span,
            div,
            li {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>

<body class="text-bone font-sans antialiased">

    <!-- EXPORT CONTROLS -->
    <div id="export-controls" class="fixed top-8 right-8 z-50 flex items-center gap-6">
        <a href="index.html"
            class="font-mono text-[9px] uppercase tracking-[0.4em] text-fog/60 hover:text-bone transition-all">← Back to
            Brief</a>
        <button onclick="window.print()"
            class="px-5 py-2 bg-amber/10 border border-amber/20 hover:bg-amber/20 text-amber font-mono text-[9px] uppercase tracking-[0.4em] transition-all rounded">
            Export PDF
        </button>
    </div>

    <!-- SLIDE 01: TITLE -->
    <section class="slide">
        <span class="slide-tag">Briefs Studio // [Category]</span>
        <div class="max-w-5xl">
            <h1 class="font-serif text-7xl md:text-8xl font-semibold leading-tight mb-8">
                [Client Name]<br>
                <span class="gradient-text italic">[Project Title]</span>
            </h1>
            <p class="font-serif text-3xl text-fog italic max-w-3xl">
                [High-level sub-statement or value proposition.]
            </p>
        </div>
        <span class="slide-number">01 // TITLE</span>
    </section>

    <!-- [Add more slides as needed] -->

</body>

</html>
