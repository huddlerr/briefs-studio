<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Briefs Studio Motion Lab | Pro Editor</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <header class="app-header">
        <div class="brand">
            <div class="brand-dot"></div>
            Briefs Studio MOTION LAB
        </div>
        <div class="header-center" style="display: flex; gap: 20px; align-items: center;">
            <select id="brief-selector" class="prop-input" style="width: 200px;">
                <option value="">Select Target Brief...</option>
                <option value="josh-bryan">Josh Bryan</option>
                <option value="occwi">OCCWI</option>
                <option value="mycelium">Mycelium</option>
            </select>
        </div>
        <div class="header-actions">
            <button class="btn" id="save-scene">Save Lab State</button>
            <button class="btn btn-primary" id="deploy-btn">Push to Brief</button>
        </div>
    </header>

    <main class="main-editor">
        <!-- New Vertical Toolbar -->
        <aside class="toolbar">
            <button class="tool-btn active" id="tool-select" title="Select (V)">⬀</button>
            <button class="tool-btn" id="tool-pen" title="Pen (P)">🖋</button>
            <button class="tool-btn" id="tool-rect" title="Rectangle (R)">▢</button>
            <button class="tool-btn" id="tool-circle" title="Circle (O)">◯</button>
            <button class="tool-btn" id="tool-text" title="Text (T)">T</button>
            <div style="height: 1px; width: 30px; background: var(--border-dim); margin: 4px 0;"></div>
            <button class="tool-btn" id="tool-path-edit" title="Direct Selection (A)">⬁</button>
            <button class="tool-btn" id="tool-delete" title="Delete (Del)">✕</button>
        </aside>

        <!-- Sidebar: Layers & Assets -->
        <aside class="panel panel-left">
            <div class="panel-header">Layers</div>
            <div class="layer-list" id="layers">
                <!-- Layers will be injected here -->
            </div>

            <div class="panel-header" style="margin-top: 20px;">Arrangement</div>
            <div class="tool-group" style="flex-direction: row; flex-wrap: wrap;">
                <button class="btn" id="bring-forward">↑</button>
                <button class="btn" id="send-backward">↓</button>
                <button class="btn" id="bring-to-front">⇈</button>
                <button class="btn" id="send-to-back">⇊</button>
            </div>
        </aside>

        <!-- Main Workspace -->
        <section class="canvas-wrapper">
            <div class="canvas-container">
                <canvas id="motion-canvas" width="800" height="450"></canvas>
            </div>
        </section>

        <!-- Inspector: Properties -->
        <aside class="panel panel-right">
            <div class="panel-header">Appearance</div>
            <div id="inspector-content">
                <div class="prop-row">
                    <label>X / Y</label>
                    <div style="display: flex; gap: 4px;">
                        <input type="number" class="prop-input" id="prop-x">
                        <input type="number" class="prop-input" id="prop-y">
                    </div>
                </div>
                <div class="prop-row">
                    <label>W / H</label>
                    <div style="display: flex; gap: 4px;">
                        <input type="number" class="prop-input" id="prop-w">
                        <input type="number" class="prop-input" id="prop-h">
                    </div>
                </div>
                <div class="prop-row">
                    <label>Scale</label>
                    <input type="number" class="prop-input" id="prop-scale" step="0.1" value="1">
                </div>
                <div class="prop-row">
                    <label>Rotate</label>
                    <input type="number" class="prop-input" id="prop-rotation">
                </div>
                <div class="prop-row">
                    <label>Fill</label>
                    <input type="color" id="prop-fill">
                </div>
                <div class="prop-row">
                    <label>Stroke</label>
                    <div style="display: flex; gap: 4px; align-items: center;">
                        <input type="color" id="prop-stroke" value="#000000">
                        <input type="number" class="prop-input" id="prop-stroke-width" value="0" style="width: 40px;">
                    </div>
                </div>
                <div class="prop-row">
                    <label>Opacity</label>
                    <input type="range" id="prop-opacity" min="0" max="1" step="0.1" value="1" style="width: 80px;">
                </div>

                <div class="panel-header" style="margin-top: 20px;">Animation / Easing</div>
                <div class="prop-row">
                    <button class="btn btn-primary" id="set-keyframe" style="width: 100%;">Keyframe Selection</button>
                </div>
                <div class="prop-row">
                    <label>Curve</label>
                    <select class="prop-input" id="prop-easing" style="width: 120px;">
                        <option value="power2.out">Smooth Out</option>
                        <option value="power2.inOut">Smooth In/Out</option>
                        <option value="elastic.out(1, 0.3)">Elastic</option>
                        <option value="bounce.out">Bounce</option>
                        <option value="back.out(1.7)">Back Out</option>
                        <option value="none">Linear</option>
                    </select>
                </div>
            </div>
        </aside>
    </main>

    <!-- New Multi-Track Timeline -->
    <footer class="timeline-area">
        <aside class="timeline-labels">
            <div class="track-label" style="background: var(--bg-deep); height: 24px;">Layers / Tracks</div>
            <div id="track-labels-container">
                <!-- Track labels like "Rect 1" injected here -->
            </div>
        </aside>
        <section class="timeline-track-area" id="timeline-track-area">
            <div class="timeline-ruler-top" id="timeline-ruler"></div>
            <div class="playhead" id="playhead">
                <div class="playhead-head"></div>
            </div>
            <div id="tracks-container">
                <!-- Track rows with keyframes injected here -->
            </div>
        </section>
    </footer>

    <!-- Global Controls Floating (Optional) -->
    <div style="position: absolute; bottom: 300px; left: 80px; display: flex; gap: 8px;">
        <button class="btn" id="play-btn">Play</button>
        <button class="btn" id="stop-btn">Stop</button>
        <div id="time-display" style="color: var(--text-dim); font-size: 12px; margin-left: 12px; align-self: center;">
            0.00s</div>
    </div>

    <script src="main.js"></script>
</body>

</html>
