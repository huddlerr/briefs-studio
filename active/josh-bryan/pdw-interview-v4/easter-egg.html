<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[ UNLOCKED ] - Secret Message</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Space+Mono&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --void: #000000;
            --accent-green: #4ade80;
            --text-primary: #f5f5f5;
            --font-main: 'Montserrat', sans-serif;
            --font-mono: 'Space Mono', monospace;
        }

        body {
            background-color: var(--void);
            color: var(--text-primary);
            font-family: var(--font-main);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 2rem;
            overflow: hidden;
        }

        .container {
            max-width: 800px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 1s forwards ease-out;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .subtitle {
            font-family: var(--font-mono);
            font-size: 1.25rem;
            letter-spacing: 0.4em;
            color: var(--accent-green);
            margin-bottom: 2rem;
            text-transform: uppercase;
        }

        .line-divider {
            width: 80px;
            height: 2px;
            background-color: var(--accent-green);
            margin: 0 auto 3rem;
        }

        .message {
            font-size: 2.5rem;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 2rem;
        }

        .signature {
            font-family: var(--font-mono);
            font-size: 1.5rem;
            color: var(--accent-green);
        }
    </style>
</head>

<body>
    <div class="container">
        <h2 class="subtitle">[ UNLOCKED ]</h2>
        <div class="line-divider"></div>
        <p class="message">
            Thank you for your time and consideration and congratulations for finding the Easter egg.
        </p>
        <p class="signature">- Josh Bryan</p>
    </div>
</body>

</html>
