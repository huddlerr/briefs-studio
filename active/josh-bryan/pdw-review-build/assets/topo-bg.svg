<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(180, 140, 100, 0.2)" />
      <stop offset="50%" style="stop-color:rgba(180, 140, 100, 0.4)" />
      <stop offset="100%" style="stop-color:rgba(180, 140, 100, 0.2)" />
    </linearGradient>
  </defs>
  <style>
    path {
      fill: none;
      stroke: url(#lineGrad);
      stroke-width: 0.8;
      transition: all 0.5s ease;
      filter: url(#glow);
    }
    .major {
      stroke-width: 1.5;
      stroke: rgba(180, 140, 100, 0.5);
    }
  </style>
  <g id="terrain">
    <!-- Row 1 -->
    <path d="M0,100 C200,80 400,150 600,100 S900,20 1200,100 S1600,180 1920,100" />
    <path class="major" d="M0,150 C250,120 500,200 750,150 S1100,50 1400,150 S1750,220 1920,150" />
    <path d="M0,200 C300,180 600,250 850,200 S1200,80 1550,200 S1850,280 1920,200" />
    
    <!-- Complex Peak Right Upper -->
    <path d="M1400,300 C1450,250 1550,250 1600,300 S1650,400 1600,450 S1500,500 1400,450 S1350,350 1400,300" />
    <path class="major" d="M1350,250 C1420,180 1580,180 1650,250 S1720,420 1650,500 S1480,580 1350,500 S1280,320 1350,250" />
    <path d="M1300,200 C1400,100 1650,100 1750,200 S1850,450 1750,550 S1550,650 1300,550 S1200,300 1300,200" />
    <path d="M1250,150 C1380,50 1720,50 1850,150 S1980,480 1850,600 S1600,720 1250,600 S1120,250 1250,150" />
    
    <!-- Flowing ridges across middle -->
    <path d="M0,400 C300,350 600,500 900,400 S1300,300 1600,450 S1850,600 1920,400" />
    <path class="major" d="M0,500 C400,450 800,600 1100,500 S1500,400 1800,550 S1920,700 1920,500" />
    <path d="M0,600 C500,550 900,700 1200,600 S1600,500 1850,650 S1920,800 1920,600" />
    
    <!-- Lower Left Peak -->
    <path d="M300,700 C350,650 450,650 500,700 S550,800 500,850 S400,900 300,850 S250,750 300,700" />
    <path class="major" d="M250,650 C320,580 480,580 550,650 S620,820 550,900 S380,980 250,900 S180,720 250,650" />
    <path d="M200,600 C300,500 550,500 650,600 S750,850 650,950 S450,1050 200,950 S100,700 200,600" />
    
    <!-- Bottom right patterns -->
    <path d="M1000,800 C1150,750 1300,850 1450,800 S1650,750 1800,850" />
    <path class="major" d="M900,900 C1100,850 1350,1000 1600,900 S1850,850 1920,950" />
    <path d="M800,1000 C1050,950 1400,1100 1700,1000 S1900,950 1920,1050" />
    
    <!-- Decorative intricate bits -->
    <path d="M1500,800 Q1550,780 1580,820 T1610,860" />
    <path d="M1520,820 Q1560,800 1590,840 T1620,880" />
    <path d="M1540,840 Q1570,820 1600,860 T1630,900" />
  </g>
</svg>
